
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Serves Bingo</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F5F2EA">

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      background:#F5F2EA;
      color:#333;
    }

    .wrapper{
      max-width:760px;
      margin:auto;
      padding:10px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    h1{
      margin:0;
      font-size:34px;
    }

    .streak{
      background:#fff;
      border:1px solid #D8D2C6;
      border-radius:16px;
      padding:14px;
      margin:10px 0;
      font-size:18px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .card{
      background:#fff;
      border:1px solid #D8D2C6;
      border-radius:18px;
      padding:10px;
    }

    .head{
      display:flex;
      justify-content:space-between;
      font-weight:700;
      margin-bottom:8px;
      font-size:17px;
    }

    .cells{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
    }

    .cell{
      aspect-ratio:1;
      border:1px solid #D8D2C6;
      border-radius:12px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      cursor:pointer;
    }

    button{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #D8D2C6;
      background:white;
      font-size:16px;
    }

    .banner{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      background:#16A34A;
      color:white;
      padding:10px 18px;
      border-radius:999px;
      font-weight:700;
      display:none;
      z-index:10;
    }
  </style>
</head>

<body>

<div id="banner" class="banner">🎉 Daily goal complete!</div>

<div class="wrapper">

  <div class="top">
    <h1>🍽️</h1>
    <button id="reset">Reset</button>
  </div>

  <div class="streak">
    🔥 <b id="streak">0</b> day streak
  </div>

  <div id="grid" class="grid"></div>

</div>

<script>

const groups=[
  ["Vegetables",6,"#4CAF50",false],
  ["Grains",6,"#E3A12A",false],
  ["Fruit",2,"#E85D5D",false],
  ["Dairy",3,"#F4D03F",false],
  ["Protein",3,"#8E5AE8",false],
  ["Water",6,"#4A90E2",false],
  ["Discretionary",6,"#FFFFFF",true]
];

const today=new Date().toISOString().slice(0,10);

let data=JSON.parse(localStorage.getItem("servesBingoV2")||"{}");

if(data.date!==today){

  let streak=data.streak||0;

  if(data.done){
    streak++;
  }else if(data.date){
    streak=0;
  }

  data={
    date:today,
    streak:streak,
    done:false,
    counts:{}
  };

  groups.forEach(g=>data.counts[g[0]]=0);
}

function save(){
  localStorage.setItem("servesBingoV2",JSON.stringify(data));
}

function healthyComplete(){

  const targets={
    Vegetables:6,
    Grains:6,
    Fruit:2,
    Dairy:3,
    Protein:3,
    Water:6
  };

  return Object.keys(targets).every(name=>data.counts[name]===targets[name]);

}

function draw(){

  document.getElementById("streak").textContent=data.streak;

  const grid=document.getElementById("grid");
  grid.innerHTML="";

  groups.forEach(group=>{

    const name=group[0];
    const max=group[1];
    const colour=group[2];
    const cross=group[3];

    const card=document.createElement("div");
    card.className="card";

    const head=document.createElement("div");
    head.className="head";
    head.innerHTML=
      `<span>${name}</span>
       <span>${data.counts[name]}/${max}</span>`;

    const cells=document.createElement("div");
    cells.className="cells";

    for(let i=0;i<max;i++){

      const cell=document.createElement("div");
      cell.className="cell";

      if(i<data.counts[name]){

        if(cross){
          cell.textContent="✕";
          cell.style.color="#2563EB";
        }else{
          cell.style.background=colour;
        }

      }

      cell.onclick=()=>{

        const wasDone=data.done;

        data.counts[name]=
          i<data.counts[name] ? i : i+1;

        data.done=healthyComplete();

        if(!wasDone && data.done){
          const banner=document.getElementById("banner");
          banner.style.display="block";
          setTimeout(()=>banner.style.display="none",1800);
        }

        save();
        draw();

      };

      cells.appendChild(cell);

    }

    card.appendChild(head);
    card.appendChild(cells);

    grid.appendChild(card);

  });

}

document.getElementById("reset").onclick=()=>{

  groups.forEach(g=>data.counts[g[0]]=0);

  data.done=false;

  save();
  draw();

};

save();
draw();

</script>

</body>
</html>

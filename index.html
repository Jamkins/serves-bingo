<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serves Bingo</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F5F2EA"><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F5F2EA;color:#333}.w{max-width:760px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}h2{margin:0;font-size:36px}.st{background:#fff;border:1px solid #D8D2C6;border-radius:16px;padding:14px;margin:10px 0;font-size:18px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.c{background:#fff;border:1px solid #D8D2C6;border-radius:18px;padding:10px}.h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}.s{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.b{aspect-ratio:1;border:1px solid #D8D2C6;border-radius:12px;background:#fff;font-size:30px;display:flex;align-items:center;justify-content:center}button{padding:10px 14px;border-radius:12px;border:1px solid #D8D2C6;background:#fff}.bn{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#16A34A;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;display:none}
</style></head><body><div id=bn class=bn>🎉 Daily goal complete!</div><div class=w><div class=top><h2>🍽️</h2><button id=r>Reset</button></div><div class=st>🔥 <b id=streak>0</b> day streak</div><div id=grid class=g></div></div><script>
const G=[["Vegetables",6,"#4CAF50",0],["Grains",6,"#E3A12A",0],["Fruit",2,"#E85D5D",0],["Dairy",3,"#F4D03F",0],["Protein",3,"#8E5AE8",0],["Water",6,"#4A90E2",0],["Discretionary",6,"#fff",1]],T=new Date().toISOString().slice(0,10);let d=JSON.parse(localStorage.sb4||'{}');if(d.date!==T){let s=d.streak||0;if(d.done)s++;else if(d.date)s=0;d={date:T,streak:s,done:false,counts:{}};G.forEach(x=>d.counts[x[0]]=0)};const save=()=>localStorage.sb4=JSON.stringify(d),goal=()=>["Vegetables","Grains","Fruit","Dairy","Protein","Water"].every(n=>d.counts[n]===G.find(x=>x[0]===n)[1]);function draw(){streak.textContent=d.streak;grid.innerHTML='';G.forEach(x=>{let c=document.createElement('div');c.className='c';c.innerHTML=`<div class=h><span>${x[0]}</span><span>${d.counts[x[0]]}/${x[1]}</span></div>`;let s=document.createElement('div');s.className='s';for(let i=0;i<x[1];i++){let b=document.createElement('button');b.className='b';if(i<d.counts[x[0]]){if(x[3]){b.textContent='✕';b.style.color='#1D4ED8'}else b.style.background=x[2]}b.onclick=()=>{const was=d.done;d.counts[x[0]]=i<d.counts[x[0]]?i:i+1;d.done=goal();if(!was&&d.done){bn.style.display='block';setTimeout(()=>bn.style.display='none',1800)}save();draw()};s.appendChild(b)}c.appendChild(s);grid.appendChild(c)})}r.onclick=()=>{G.forEach(x=>d.counts[x[0]]=0);d.done=false;save();draw()};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');save();draw();
</script></body></html>

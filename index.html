<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serves Bingo</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F5F2EA"><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F5F2EA;color:#333}.w{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.st{background:#fff;border:1px solid #D8D2C6;border-radius:14px;padding:12px;margin:12px 0}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.c{background:#fff;border:1px solid #D8D2C6;border-radius:16px;padding:12px}.h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}.s{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.b{aspect-ratio:1;border:1px solid #D8D2C6;border-radius:8px;background:#fff;font-size:28px}button{padding:8px 12px;border-radius:10px;border:1px solid #D8D2C6;background:#fff}
</style></head><body><div class=w><div class=top><h2>🍽️ Serves Bingo</h2><button id=r>Reset</button></div><div class=st>🔥 <b id=streak>0</b> day streak</div><div id=grid class=g></div></div><script>
const G=[["Vegetables",6,"#4CAF50",0],["Grains",6,"#E3A12A",0],["Fruit",2,"#E85D5D",0],["Dairy",3,"#F4D03F",0],["Protein",3,"#8E5AE8",0],["Water",6,"#4A90E2",0],["Discretionary",6,"#fff",1]],T=new Date().toISOString().slice(0,10);let d=JSON.parse(localStorage.sb2||"{}");if(!d.streak)d.streak=0;if(d.date!==T){if(d.date&&d.done)d.streak++;d={date:T,streak:d.streak,done:false,counts:{}};G.forEach(x=>d.counts[x[0]]=0)};const save=()=>localStorage.sb2=JSON.stringify(d),ok=()=>["Vegetables","Grains","Fruit","Dairy","Protein","Water"].every(n=>d.counts[n]===G.find(x=>x[0]===n)[1]);function draw(){streak.textContent=d.streak;grid.innerHTML="";G.forEach(x=>{let card=document.createElement("div");card.className="c";card.innerHTML=`<div class=h><span>${x[0]}</span><span>${d.counts[x[0]]}/${x[1]}</span></div>`;let s=document.createElement("div");s.className="s";for(let i=0;i<x[1];i++){let bt=document.createElement("button");bt.className="b";if(i<d.counts[x[0]]){if(x[3])bt.textContent="✕";else bt.style.background=x[2]}bt.onclick=()=>{d.counts[x[0]]=i<d.counts[x[0]]?i:i+1;d.done=ok();save();draw()};s.appendChild(bt)}card.appendChild(s);grid.appendChild(card)})}r.onclick=()=>{G.forEach(x=>d.counts[x[0]]=0);d.done=false;save();draw()};if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");save();draw();
</script></body></html>

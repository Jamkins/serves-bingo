
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serves Bingo</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F2EA">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#F5F2EA;
  color:#333;
}

.wrapper{
  max-width:760px;
  margin:auto;
  padding:10px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  margin:0;
  font-size:36px;
}

button{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #D8D2C6;
  background:white;
  font-size:16px;
}

.streak{
  background:white;
  border:1px solid #D8D2C6;
  border-radius:16px;
  padding:14px;
  margin:10px 0;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.card{
  background:white;
  border:1px solid #D8D2C6;
  border-radius:18px;
  padding:10px;
}

.head{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  margin-bottom:8px;
  font-size:17px;
}

.cells{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.cell{
  width:100%;
  aspect-ratio:1;
  box-sizing:border-box;
  border:1px solid #D8D2C6;
  border-radius:12px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.cell.xmark{
  position:relative;
}

.cell.xmark::before,
.cell.xmark::after{
  content:"";
  position:absolute;
  width:60%;
  height:4px;
  background:#2563EB;
  border-radius:99px;
}

.cell.xmark::before{
  transform:rotate(45deg);
}

.cell.xmark::after{
  transform:rotate(-45deg);
}

.banner{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:#16A34A;
  color:white;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  display:none;
  z-index:100;
}
</style>
</head>

<body>

<div id="banner" class="banner">🎉 Daily goal complete!</div>

<div class="wrapper">

  <div class="top">
    <h1>🍽️</h1>
    <button id="reset">Reset</button>
  </div>

  <div class="streak">
    🔥 <b id="streak">0</b> day streak
  </div>

  <div id="grid" class="grid"></div>

</div>

<script>
const groups=[
["Vegetables",6,"#4CAF50",false],
["Grains",6,"#E3A12A",false],
["Fruit",2,"#E85D5D",false],
["Dairy",3,"#F4D03F",false],
["Protein",3,"#8E5AE8",false],
["Water",6,"#4A90E2",false],
["Discretionary",6,"#FFFFFF",true]
];

const today=new Date().toISOString().slice(0,10);

let data=JSON.parse(localStorage.getItem("servesBingoV3")||"{}");

if(data.date!==today){

  let streak=data.streak||0;

  if(data.done){
    streak++;
  }else if(data.date){
    streak=0;
  }

  data={
    date:today,
    streak:streak,
    done:false,
    counts:{}
  };

  groups.forEach(g=>data.counts[g[0]]=0);
}

function save(){
  localStorage.setItem("servesBingoV3",JSON.stringify(data));
}

function goalComplete(){

  const target={
    Vegetables:6,
    Grains:6,
    Fruit:2,
    Dairy:3,
    Protein:3,
    Water:6
  };

  return Object.keys(target).every(k=>data.counts[k]===target[k]);
}

function draw(){

  document.getElementById("streak").textContent=data.streak;

  const grid=document.getElementById("grid");
  grid.innerHTML="";

  groups.forEach(g=>{

    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <div class="head">
        <span>${g[0]}</span>
        <span>${data.counts[g[0]]}/${g[1]}</span>
      </div>`;

    const cells=document.createElement("div");
    cells.className="cells";

    for(let i=0;i<g[1];i++){

      const cell=document.createElement("div");
      cell.className="cell";

      if(i<data.counts[g[0]]){

        if(g[3]){
          cell.classList.add("xmark");
        }else{
          cell.style.background=g[2];
        }

      }

      cell.onclick=()=>{

        const wasComplete=data.done;

        data.counts[g[0]]=
          i<data.counts[g[0]] ? i : i+1;

        data.done=goalComplete();

        if(!wasComplete && data.done){

          const banner=document.getElementById("banner");
          banner.style.display="block";

          setTimeout(()=>{
            banner.style.display="none";
          },1800);
        }

        save();
        draw();
      };

      cells.appendChild(cell);
    }

    card.appendChild(cells);
    grid.appendChild(card);

  });

}

document.getElementById("reset").onclick=()=>{

  groups.forEach(g=>data.counts[g[0]]=0);

  data.done=false;

  save();
  draw();
};

save();
draw();
</script>

</body>
</html>
